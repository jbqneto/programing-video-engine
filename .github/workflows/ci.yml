name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Offline asset CLI tests
        run: npm run test
      - name: Project smoke check
        run: npm run smoke
      - name: Validate sample project
        run: npm run validate
      - name: Type check
        run: npm run typecheck
      - name: Build preview UI
        run: npm run ui:build
      - name: Verify stdio and local HTTP MCP
        run: npm run mcp:check
